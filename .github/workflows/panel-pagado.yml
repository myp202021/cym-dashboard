name: Panel CyM - pagado automático (Meta)
# Reemplaza el launchd del Mac (scripts/seguimiento/actualizar.sh). 08:00 y 15:00 de Chile.
# El orgánico no se toca: build.py conserva lo ya publicado del mes (la lista de CyM tiene datos personales y no está en GitHub).
on:
  schedule:
    - cron: '0 11,18 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: panel-pagado
jobs:
  pagado:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      META_TOKEN_MYP: ${{ secrets.META_TOKEN_MYP }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bajar Meta y armar el panel
        run: |
          if [ -z "$META_TOKEN_MYP" ]; then echo "Falta el secreto META_TOKEN_MYP"; exit 1; fi
          mkdir -p scripts/seguimiento/raw
          MES=$(TZ=America/Santiago date +%Y-%m)
          DIA=$(TZ=America/Santiago date +%-d)
          if [ "$DIA" -le 3 ]; then
            ANT=$(TZ=America/Santiago date -d "$(TZ=America/Santiago date +%Y-%m-01) -1 day" +%Y-%m)
            python3 scripts/seguimiento/meta-api.py $ANT
            python3 scripts/seguimiento/build.py $ANT
          fi
          python3 scripts/seguimiento/meta-api.py $MES
          python3 scripts/seguimiento/build.py $MES
      - name: Publicar
        run: |
          git config user.name "Christopher Muller"
          git config user.email "christopher@mulleryperez.cl"
          git add data/
          git diff --cached --quiet && { echo "Sin cambios"; exit 0; }
          git commit -m "Panel CyM: pagado automático $(TZ=America/Santiago date '+%Y-%m-%d %H:%M')"
          git pull --rebase -q && git push -q
