name: Fiscalización de Leads WhatsApp

on:
  schedule:
    - cron: '0 12-20 * * 1-5'  # Cada hora de 09:00 a 17:00 Chile (UTC-3), lunes a viernes
  workflow_dispatch:       # Manual trigger para testing

jobs:
  fiscalizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enviar WhatsApp de fiscalización
        run: node scripts/whatsapp-fiscalizacion.js
        env:
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
